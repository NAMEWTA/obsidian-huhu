<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>candidate-b · 柔和分组 展开式行</title>
<style>
/* candidate-b: soft grouped surfaces, roomier controls, expandable rows. PREVIEW-ONLY fallbacks. */
:root { color-scheme: light; --bg: #fbfaf8; --card: #ffffff; --sec: #efece6; --hover: #e7e3db; --line: #e2ddd3; --ctl: #7e7a70; --fg: #23211d; --mut: #5c574d; --acc: #2f5f86; --onacc: #fff; --ok: #1f6d37; --bad: #ad2b22; --r1: 12px; --r2: 16px; --h: 40px; --font: "Geist", system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
html[data-theme="dark"] { color-scheme: dark; --bg: #1d1c1a; --card: #262522; --sec: #2d2b28; --hover: #383530; --line: #3d3a35; --ctl: #8f8b80; --fg: #ebe8e1; --mut: #b0ab9f; --acc: #86b6df; --onacc: #0b1b29; --ok: #7ad093; --bad: #ff948b; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); }
.wrap { container-type: inline-size; max-width: 760px; margin: 0 auto; padding: 16px; }
button { font: inherit; color: inherit; }
.b { min-height: var(--h); min-width: 40px; padding: 0 16px; border: 1px solid var(--ctl); border-radius: var(--r1); background: var(--card); cursor: pointer; font-size: 14px; font-weight: 500; transition: background-color 120ms ease; }
.b:hover { background: var(--hover); }
.b:focus-visible, summary:focus-visible, [role=switch]:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.b.p { background: var(--acc); border-color: var(--acc); color: var(--onacc); }
.b[aria-pressed="true"] { background: var(--sec); border-color: var(--acc); }
.b[aria-busy="true"] { opacity: .6; pointer-events: none; cursor: progress; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar h1 { font-size: 22px; margin: 0 auto 0 0; }
.lead { color: var(--mut); margin: 8px 0 16px; font-size: 14px; }
.grp { background: var(--sec); border-radius: var(--r2); padding: 8px; display: grid; gap: 8px; }
.grp > h2 { margin: 8px 8px 0; font-size: 13px; letter-spacing: .04em; color: var(--mut); font-weight: 600; }
details.it { background: var(--card); border-radius: var(--r1); }
summary { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px; cursor: pointer; list-style: none; border-radius: var(--r1); }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; width: 8px; height: 8px; border: solid var(--mut); border-width: 0 2px 2px 0; transform: rotate(45deg); flex: none; margin-left: 4px; }
details[open] summary::after { transform: rotate(-135deg); }
summary:hover { background: var(--hover); }
.nm { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.body { padding: 4px 16px 16px; display: grid; gap: 12px; }
.mt { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--mut); font-size: 13px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { padding: 0 10px; border-radius: 10px; background: var(--sec); color: var(--fg); font-size: 12px; }
.tag.ok { color: var(--ok); } .tag.bad { color: var(--bad); }
[role=switch] { width: 40px; height: 24px; border-radius: 12px; border: 0; background: var(--ctl); position: relative; cursor: pointer; padding: 0; }
[role=switch]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); transition: transform 120ms ease; }
[role=switch][aria-checked="true"] { background: var(--acc); }
[role=switch][aria-checked="true"]::after { transform: translateX(16px); }
.sw-wrap { min-width: 44px; min-height: 44px; display: grid; place-items: center; }
.sw { }
.toast { margin-top: 16px; background: var(--card); border-radius: var(--r1); padding: 16px; display: grid; gap: 8px; box-shadow: 0 0 0 1px var(--line); }
.toast h2 { margin: 0; font-size: 15px; }
.toast p { margin: 0; font-size: 13px; color: var(--mut); }
.toast .kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.toast .kv b { color: var(--mut); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
<main>
  <div class="bar">
    <h1><span data-i18n="cand">候选</span> B · <span data-i18n="title">自动化</span></h1>
    <button class="b" type="button" data-ctl="lang" data-v="zh" aria-pressed="true">中文</button>
    <button class="b" type="button" data-ctl="lang" data-v="en" aria-pressed="false">English</button>
    <button class="b" type="button" data-ctl="theme" data-v="light" aria-pressed="true" data-i18n="light">亮</button>
    <button class="b" type="button" data-ctl="theme" data-v="dark" aria-pressed="false" data-i18n="dark">暗</button>
  </div>
  <p class="lead" data-i18n="sub">sub</p>
  <section class="grp" aria-labelledby="gb">
    <h2 id="gb" data-i18n="title">自动化</h2>
    <details class="it">
      <summary><span class="nm" data-i18n="n1">n1</span><span class="sw-wrap"><button class="sw" type="button" role="switch" aria-checked="true" data-switch data-i18n-aria="on"></button></span></summary>
      <div class="body"><p class="mt"><span data-i18n="sched">sched</span><span class="tag ok" data-i18n="ok">ok</span><span data-i18n="ago12">ago12</span></p>
        <div class="acts"><button class="b p" type="button" data-run data-i18n="run">运行</button><button class="b" type="button" data-i18n="edit">编辑</button><button class="b" type="button" data-i18n="copy">复制 ID</button></div></div>
    </details>
    <details class="it">
      <summary><span class="nm" data-i18n="n2">n2</span><span class="sw-wrap"><button class="sw" type="button" role="switch" aria-checked="true" data-switch data-i18n-aria="on"></button></span></summary>
      <div class="body"><p class="mt"><span data-i18n="file">file</span><span class="tag bad" data-i18n="fail">fail</span><span data-i18n="ago95">ago95</span></p>
        <div class="acts"><button class="b p" type="button" data-run data-i18n="run">运行</button><button class="b" type="button" data-i18n="edit">编辑</button><button class="b" type="button" data-i18n="copy">复制 ID</button></div></div>
    </details>
    <details class="it">
      <summary><span class="nm" data-i18n="untitled">untitled</span><span class="sw-wrap"><button class="sw" type="button" role="switch" aria-checked="false" data-switch data-i18n-aria="off"></button></span></summary>
      <div class="body"><p class="mt"><span data-i18n="manual">manual</span><span class="tag ok" data-i18n="ok">ok</span><span data-i18n="ago25">ago25</span></p>
        <div class="acts"><button class="b p" type="button" data-run data-i18n="run">运行</button><button class="b" type="button" data-i18n="edit">编辑</button><button class="b" type="button" data-i18n="copy">复制 ID</button></div></div>
    </details>
    <details class="it">
      <summary><span class="nm" data-i18n="n5">n5</span><span class="sw-wrap"><button class="sw" type="button" role="switch" aria-checked="true" data-switch data-i18n-aria="on"></button></span></summary>
      <div class="body"><p class="mt"><span data-i18n="sched">sched</span><span class="tag " data-i18n="never">never</span></p>
        <div class="acts"><button class="b p" type="button" data-run data-i18n="run">运行</button><button class="b" type="button" data-i18n="edit">编辑</button><button class="b" type="button" data-i18n="copy">复制 ID</button></div></div>
    </details>
  </section>
  <aside class="toast" aria-labelledby="tb">
    <h2 id="tb" data-i18n="notiH">通知</h2>
    <p data-i18n="notiMain">main</p>
    <div class="kv"><span><b data-i18n="notiSnap">快照</b> <span data-i18n="n1">n1</span></span><span><b data-i18n="notiNow">现名</b> <span data-i18n="notiNowV">现名</span></span><span><b data-i18n="notiId">ID</b> a1b2c3d4</span></div>
    <div class="acts"><button class="b" type="button" data-i18n="copy">复制 ID</button></div>
    <p data-i18n="notiNote">note</p>
  </aside>
  <p class="lead"><a href="../index.html" data-i18n="back" style="color:var(--acc)">返回比较页</a></p>
</main>
</div>
<script src="../shared/fixture.js"></script>
</body>
</html>
