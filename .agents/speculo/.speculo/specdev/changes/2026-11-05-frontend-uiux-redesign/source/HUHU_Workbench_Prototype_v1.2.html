/* Module refinements reuse the workbench tokens, shared Drawer and native
   accessible controls. Production counterparts are Radix Switch / shared Tree. */

/* Task completion belongs to the text, while dates and references stay readable. */
.a-task-checkbox[type=checkbox] {
  appearance: none;
  width: 18px;
  height: 18px;
  margin: 0;
  border: 1.5px solid var(--input-border);
  border-radius: 5px;
  background: var(--bg);
  position: relative;
  display: inline-grid;
  place-content: center;
}
.a-task-checkbox[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
.a-task-checkbox[type=checkbox]:checked::after {
  content: '';
  width: 5px;
  height: 9px;
  border: solid var(--on-accent);
  border-width: 0 2px 2px 0;
  transform: translateY(-1px) rotate(45deg);
}
.a-task-checkbox:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.a-task-row.a-task-completed > td { background: color-mix(in srgb, var(--muted) 4%, transparent); }
.a-task-title-button.btn { color: var(--fg); padding: 2px 0; min-height: 28px; text-align: left; justify-content: flex-start; }
.a-task-description { margin-top: 2px; line-height: 1.6; }
.a-task-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.a-task-badges:empty { display: none; }
.a-task-completion-state { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); line-height: 18px; }
.a-task-completed .a-task-title-button { font-weight: 400; }

/* The same 36 × 20 Switch geometry as the existing production component. */
.switch.a-auto-switch { gap: 8px; min-height: 32px; white-space: nowrap; color: var(--muted); font-size: 12px; }
.switch.a-auto-switch input { width: 36px; height: 20px; flex: 0 0 36px; cursor: pointer; }
.switch.a-auto-switch input:checked::before { transform: translateX(16px); }
.switch.a-auto-switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.switch.a-auto-switch.is-enabled > span { color: var(--fg); }
.a-auto-switch-cell { width: 116px; }
.a-auto-identity { gap: 12px; }
.a-auto-identity > div { min-width: 0; }
.a-auto-identity .a-row-title { color: var(--fg); padding: 2px 0; min-height: 28px; justify-content: flex-start; }
.a-auto-identity .subtle { overflow-wrap: anywhere; }
.a-auto-row { cursor: pointer; }
.a-automation-table th:first-child { width: 40%; }
.a-automation-table th:nth-child(2) { width: 21%; }
.a-automation-table th:last-child { width: 84px; }
.a-auto-selected > td { background: var(--accent-soft); }
.a-auto-selected > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.a-auto-selected .a-row-title { color: var(--accent); }
.a-table .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* Details remain in the shared 360px inspector; no wide form grids here. */
.a-auto-inspector { min-width: 0; }
.a-auto-state-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.a-auto-inspect-tabs { margin: 12px 0 16px; gap: 12px; }
.a-auto-inspect-tabs .btn { padding-inline: 2px; min-height: 36px; font-size: 13px; }
.a-auto-inspect-sections { display: flex; flex-direction: column; gap: 20px; }
.a-auto-inspect-section { min-width: 0; }
.a-auto-inspect-section + .a-auto-inspect-section { border-top: 1px solid var(--line); padding-top: 16px; }
.a-auto-inspect-section h3 { font-size: 13px; font-weight: 600; line-height: 20px; margin: 0 0 10px; }
.a-auto-inspect-section > .row h3 { margin: 0; }
.a-auto-content { padding: 12px; margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.75 var(--mono-font); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); max-height: 300px; overflow: auto; }
.a-auto-inspect-section > .field-help { margin-top: 8px; }
.a-auto-facts { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.a-auto-facts > div { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 12px; align-items: start; }
.a-auto-facts dt { font-size: 12px; line-height: 20px; color: var(--muted); }
.a-auto-facts dd { margin: 0; font-size: 13px; line-height: 20px; overflow-wrap: anywhere; min-width: 0; }
.a-auto-facts dd.mono { font-size: 11px; }
.a-auto-facts dd .icon-btn { width: 28px; height: 28px; min-height: 28px; margin-top: -4px; }
.a-auto-next-runs, .a-auto-timeline { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.a-auto-next-runs li, .a-auto-timeline li { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums; }
.a-auto-time-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; flex: 0 0 6px; margin-top: 7px; }
.a-auto-timeline li > div { display: flex; flex-direction: column; gap: 2px; }
.a-auto-run-card { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-align: left; }
.a-auto-run-card > span { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.a-auto-run-card > svg { flex: 0 0 auto; color: var(--muted); }
.a-auto-run-card:hover { border-color: var(--input-border); background: var(--surface-2); }
.a-auto-run-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.a-auto-inspect-actions { width: 100%; display: flex; align-items: center; gap: 8px; }
.a-auto-inspect-actions .btn { font-size: 13px; padding-inline: 10px; }
.a-auto-inspector .empty { padding: 32px 12px; }
.a-auto-inspector .empty h3 { font-size: 14px; }
.a-auto-inspector .a-details { margin-bottom: 2px; }

/* Type folders → saved views / record leaves. Caret expansion is independent. */
.a-tree-toolbar { display: flex; align-items: center; gap: 2px; padding: 5px 4px 0 8px; }
.a-tree-toolbar .nav-group { flex: 1; padding: 0; }
.a-tree-toolbar .icon-btn { width: 28px; height: 28px; min-height: 28px; }
.a-tree-root-path { display: flex; align-items: center; gap: 6px; min-width: 0; margin: 4px 8px 8px; font-size: 11px; line-height: 18px; color: var(--muted); }
.a-tree-root-path svg { flex: none; }
.a-tree-root-path span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-archive-tree { display: flex; flex-direction: column; gap: 2px; }
.a-tree-item { min-width: 0; outline: none; }
.a-tree-row { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 8px 2px calc(4px + var(--tree-depth, 0) * 14px); border-radius: 6px; color: var(--muted); cursor: pointer; position: relative; font-size: 13px; line-height: 20px; }
.a-tree-row > svg { flex: 0 0 auto; }
.a-tree-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-tree-row:hover { background: var(--surface-2); color: var(--fg); }
.a-tree-item.active > .a-tree-row { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.a-tree-item[tabindex]:focus-visible { outline: none; }
.a-tree-item:focus-visible > .a-tree-row { outline: 2px solid var(--accent); outline-offset: -2px; }
.a-tree-caret, .a-tree-caret-spacer { width: 18px; height: 28px; flex: 0 0 18px; }
.a-tree-caret { display: flex; align-items: center; justify-content: center; margin: -2px 0; color: inherit; border-radius: 4px; }
.a-tree-caret:hover { background: color-mix(in srgb, var(--muted) 12%, transparent); }
.a-tree-caret[disabled] { opacity: 1; cursor: default; }
.a-tree-caret-spacer { height: 20px; }
.a-tree-children { position: relative; margin-top: 2px; }
.a-tree-children::before { content: ''; position: absolute; left: 13px; top: 1px; bottom: 6px; width: 1px; background: var(--line); }
.a-tree-draft { font-size: 10px; font-weight: 400; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; line-height: 16px; color: var(--muted); }
.a-tree-row .nav-count { font-size: 11px; min-width: 12px; text-align: right; }
.a-tree-item.active > .a-tree-row .nav-count { color: var(--accent); }
.a-tree-empty { padding: 8px 12px 8px 38px; font-size: 12px; line-height: 20px; color: var(--muted); }
.a-tree-management { margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) {
  .switch.a-auto-switch input::before { transition: none; }
}
@media (forced-colors: active) {
  .a-task-checkbox[type=checkbox] { appearance: auto; }
  .a-task-checkbox[type=checkbox]::after { display: none; }
  .switch.a-auto-switch input { border: 1px solid ButtonText; }
  .switch.a-auto-switch input:checked { background: Highlight; }
}

/* interaction-refinements.css */
/* Shared completion feedback: applied to completed text only. */
.task-completion-title,
.task-completion-description {
  color: var(--muted);
  text-decoration-line: line-through;
  text-decoration-thickness: 1.5px;
  text-decoration-color: currentColor;
  text-decoration-skip-ink: none;
}
.c-task-row.is-completed { background: color-mix(in srgb, var(--muted) 4%, transparent); }
.c-task-title { min-width: 0; text-align: left; line-height: 1.65; }
.task-completion-checkbox { width: 16px; height: 16px; flex: 0 0 auto; accent-color: var(--accent); }
.task-completion-status { color: var(--muted); font-size: 11px; white-space: nowrap; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .c-task-row { transition: background-color 140ms ease; }
}

  // A task can be planned on one day and due on another. Every calendar surface

  function calendarTaskDates(t) {

  function calendarEvents(date) {

    });
  }
  function calendarEventLabel(event) {

  function calendarDayBody() {

  function notesMini(list,limit=5) {return `<div class="c-mini-list">${list.slice(0,limit).map(n=>`<div class="c-mini-row">${noteIcon(n)}<button class="c-text-button grow truncate" data-action="c-note-open" data-id="${E(n.id)}" title="${E(n.title)}">${E(n.title)}<\/button><span class="subtle">${E(fmt(n.updatedAt).slice(5))}<\/span><\/div>`).join('')||'<p class="subtle">这里还没有笔记。<\/p>'}<\/div>`;}

  function widgetBody(w) {const k=w.kind,c=w.config||{},s=spec(k);if(k==='task')return `<div class="c-mini-toolbar"><span class="subtle">${c.filter==='completed'?'已完成':c.filter==='all'?'全部任务':'未完成'} · ${tasks().filter(t=>t.status!=='cancelled'&&(c.filter==='completed'?t.status==='completed':c.filter==='all'?true:t.status==='open')).length} 项<\/span>${btn('完整列表','c-nav-task',{variant:'ghost small'})}<\/div>${taskRows(tasks().filter(t=>t.status!=='cancelled'&&(c.filter==='completed'?t.status==='completed':c.filter==='all'?true:t.status==='open')),8)}${btn('添加任务','c-task-add',{variant:'ghost small',icon:'plus'})}`;
