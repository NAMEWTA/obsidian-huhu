name: 安装与兼容问题
description: 反馈安装、启用、平台支持、升级或原生辅助程序问题。
title: "[兼容] "
labels:
  - compatibility
  - triage
body:
  - type: markdown
    attributes:
      value: 感谢反馈 HUHU。请先搜索已有 Issue；允许使用中文或英文。不要上传真实库、令牌、Cookie、密码或未脱敏的终端记录。安全问题请参阅
        [安全策略](https://github.com/NAMEWTA/obsidian-huhu/blob/main/SECURITY.md)。
  - type: input
    id: huhu-version
    attributes:
      label: HUHU 版本
      description: 填写完整版本号，例如 0.0.1；开发版本请附提交号。
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian 版本
      description: 在 Obsidian「关于」中查看完整版本号。
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPadOS
      multiple: false
    validations:
      required: true
  - type: input
    id: system-details
    attributes:
      label: 系统版本和 CPU 架构
      description: 例如 Windows 11 x64、macOS arm64；可注明主题及有关插件。
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出现问题的阶段
      options:
        - 下载 / 解压
        - 安装 / 启用插件
        - 首次打开首页
        - 终端 helper 下载或启动
        - 更新 / 重启恢复
        - 与主题或插件组合使用
        - 其他
      multiple: false
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: 安装来源与方式
      description: 提供 Release 链接或来源；说明手动安装或其他安装方式。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 操作步骤与结果
      description: 按顺序说明操作、预期结果和实际结果。
    validations:
      required: true
  - type: dropdown
    id: fresh-vault
    attributes:
      label: 全新库且只启用 HUHU 时是否复现
      options:
        - 可以复现
        - 没有复现
        - 尚未尝试
      multiple: false
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可选截图与脱敏错误信息
      description: 不要上传用户数据；下载失败可附对应附件名称和错误。
    validations:
      required: false
  - type: checkboxes
    id: before-submit
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue，并确认本次内容不含凭据或其他敏感资料。
          required: true
