name: 商业授权申请
description: 申请企业内部使用、收费工作、销售集成或商业服务的书面授权。
title: "[商业授权] "
labels:
  - commercial-license
  - triage
body:
  - type: markdown
    attributes:
      value: HUHU 的商业使用须事先获得 NAMEWTA 的明确书面许可，包括企业内部使用和用它完成收费工作。提交、回复、打标签或关闭本 Issue
        均不等于授权。请仅提供可公开的信息；具体条款由双方另行书面约定。完整规则见
        [LICENSE](https://github.com/NAMEWTA/obsidian-huhu/blob/main/LICENSE)。
  - type: input
    id: applicant
    attributes:
      label: 申请主体
      description: 个人或机构可公开名称；不必提供证件、合同或私密联系方式。
    validations:
      required: true
  - type: dropdown
    id: usage-type
    attributes:
      label: 拟使用方式
      options:
        - 企业内部办公或内部部署
        - 用 HUHU 完成收费工作
        - 销售 / 收费分发 / 产品集成
        - 商业托管或网络服务
        - 其他商业用途
      multiple: true
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 用途与使用范围
      description: 描述拟解决的问题、使用人群、部署范围及拟使用的版本。
    validations:
      required: true
  - type: textarea
    id: distribution
    attributes:
      label: 修改、集成与分发情况
      description: 说明是否修改源码、与其他产品集成、分发软件或向网络用户提供服务。
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: 希望协商的授权条件
      description: 可提供公开的规模、期限和授权需求摘要；敏感细节不在这里公开。
    validations:
      required: false
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: 授权边界确认
      options:
        - label: 我理解提交申请不代表获得授权，商业使用开始前必须取得 NAMEWTA 的明确书面许可。
          required: true
        - label: 我理解第三方组件保留原有许可证，本申请不替代对第三方许可的遵守。
          required: true
