name: Archives implementation delivery
on:
  push:
    branches: [feat/archives-definition-domain-3]
    paths: [.github/workflows/archives-workspace.yml]
permissions:
  contents: write
concurrency:
  group: archives-implementation-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRANCH: feat/archives-definition-domain-3
      EVIDENCE: ${{ runner.temp }}/archives-evidence
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover exact reviewed patch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const zlib = require('zlib');
            const cp = require('child_process');
            fs.mkdirSync(process.env.EVIDENCE, {recursive:true});
            const prior = cp.execFileSync('git',['diff','--name-only','33c21e098ef3188cbab5a09f3e0a01fadb787715','HEAD'],{encoding:'utf8'}).trim();
            if (prior !== '.github/workflows/archives-workspace.yml') throw Error('Unexpected branch changes; refusing to overwrite');
            const shas = ['78d8093af9ec569eed78727dac3b1926840f2652','37b7f31666e74e9bc24037524f65c8ae9e86c4e6','c09c8beecee9a8f84b3c02e60ba85ffa66d9c937','afefc71c1bd5935e89256ceabbcc7794a79b0399','3e58a7f23024543c902d16ec18b9f056db9a97b6','a49982068f02a27f9e74bf31a00cb1b1a9c393d7','cacb0ce920dff092ccdc7a859813d3152bfa0c9d','2ad1f850b89245cd8e8866f527ed094af88eb36f','9fa20d8dc783c6a8875e88224d7ce82ba296f382','79d92c24c05e81dac34aa9c4eb2cb8f3b95c2881','5958c1f19ba66e0679e008d17447f166553b5a1d','2df15a0953840e83835c34226273d720f683bc15','eb45af6b5d2c404a54e3e9ecd8cd37146521b240','64be1680532f5a26e6b297bbefd0eead4a065087','ee4a7dfdbf2ee9a4e7008bdc6ceaac0397cf2d8d','faf944883249f0965868c5fb85b05e450873b087','c2323cec5254379ea0fb6f4dc678a93e8e101557'];
            const parts = []; const missing = [];
            for (let i=0;i<shas.length;i++) {
              try {
                const {data}=await github.rest.git.getBlob({...context.repo,file_sha:shas[i]});
                const bytes=Buffer.from(data.content,data.encoding);
                const hash=crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
                if(hash!==shas[i]) throw Error('Blob hash mismatch');
                parts.push(bytes); console.log(`FOUND ${i} ${shas[i]} ${bytes.length}`);
              } catch(error) {
                if(error.status!==404) throw error;
                missing.push(i); console.log(`MISSING ${i} ${shas[i]}`);
              }
            }
            if(missing.length) throw Error(`Missing transfer parts: ${missing.join(',')}`);
            const compressed=Buffer.concat(parts);
            if(crypto.createHash('sha256').update(compressed).digest('hex')!=='9886056a90599999f10ce7ccbd9e6447acaa1671e309b497b16c5dafbeaa20d1') throw Error('Compressed patch mismatch');
            const patch=zlib.brotliDecompressSync(compressed);
            if(crypto.createHash('sha256').update(patch).digest('hex')!=='63c618993b1c0c990a1ebdd0eef69b66a64faac41888d773e11df78b354c6391') throw Error('Reviewed patch mismatch');
            const paths=[...new Set(patch.toString('utf8').split('\n').filter(x=>x.startsWith('+++ b/')).map(x=>x.slice(6)))].sort();
            if(paths.length!==70 || paths.some(p=>!/^([a-zA-Z0-9_.-]+\/)*[a-zA-Z0-9_.-]+$/.test(p) || p.includes('..') || p.startsWith('.github/') || p.startsWith('node_modules/'))) throw Error('Unexpected patch scope');
            const patchPath=path.join(process.env.RUNNER_TEMP,'archives-reviewed.patch');
            fs.writeFileSync(patchPath,patch);
            cp.execFileSync('git',['apply','--check',patchPath]);
            cp.execFileSync('git',['apply',patchPath]);
            const manifest=paths.map(p=>`${crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')}  ${p}\n`).join('');
            if(crypto.createHash('sha256').update(manifest).digest('hex')!=='b44fb3e21434e920db99c994baf5136bb391ac39c1b6a0c773a89f2b23c42311') throw Error('Source manifest mismatch');
            fs.writeFileSync(path.join(process.env.EVIDENCE,'source-SHA256SUMS'),manifest);
            fs.writeFileSync(path.join(process.env.EVIDENCE,'paths.json'),JSON.stringify(paths));
            fs.unlinkSync('.github/workflows/archives-workspace.yml');
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:css 2>&1 | tee "$EVIDENCE/build-css.log"
          pnpm run build 2>&1 | tee "$EVIDENCE/build.log"
          pnpm exec vitest run src/modules/archives src/modules/home/ui/widgets/records-body.dom.test.tsx src/modules/home/core/board/recent-doc-policy.test.ts src/shell/navigation-state.test.ts --reporter=default --reporter=json --outputFile.json="$EVIDENCE/target-tests.json" 2>&1 | tee "$EVIDENCE/tests.log"
          for check in lint lint:css test:architecture test:i18n test:promise-callbacks test:ui-adapters test:build-text check:bundle check:notices; do
            pnpm run "$check" 2>&1 | tee "$EVIDENCE/${check//:/-}.log"
          done
          git diff --check
      - name: Record documentation check against unchanged baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/verify-docs.mjs > "$EVIDENCE/docs-current.log" 2>&1
          current=$?
          set -e
          git worktree add --detach "$RUNNER_TEMP/archives-baseline" 33c21e098ef3188cbab5a09f3e0a01fadb787715
          set +e
          (cd "$RUNNER_TEMP/archives-baseline" && node scripts/verify-docs.mjs) > "$EVIDENCE/docs-baseline.log" 2>&1
          baseline=$?
          set -e
          printf 'current=%s baseline=%s\n' "$current" "$baseline" | tee "$EVIDENCE/docs-status.txt"
          cat "$EVIDENCE/docs-current.log"
          python3 - "$EVIDENCE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/archives-baseline" <<'PY'
          import pathlib, sys
          evidence=pathlib.Path(sys.argv[1])
          a=(evidence/'docs-current.log').read_text().replace(sys.argv[2],'<repo>')
          b=(evidence/'docs-baseline.log').read_text().replace(sys.argv[3],'<repo>')
          if a != b:
              raise SystemExit('Documentation diagnostics changed; review required before publishing')
          PY
      - name: Commit exact sources and verified build outputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$EVIDENCE/source-SHA256SUMS"
          printf '%s  main.js\n%s  styles.css\n' '3048808323fcc0235e5edd157b840f617b03a5dddf01a6b709154ecb90fb3536' 'f387ffd28b22a24e81a9fbf5e4cacf9c5dc868456a8b62d2e9dd5fd302ab850d' | sha256sum -c -
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python3 - "$EVIDENCE/paths.json" <<'PY'
          import json, subprocess, sys
          paths=json.load(open(sys.argv[1]))+['main.js','styles.css','.github/workflows/archives-workspace.yml']
          subprocess.run(['git','add','--',*paths],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if sorted(staged)!=sorted(paths): raise SystemExit('Unexpected staged files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(archives): 实现通用类型表单、独立关系与可恢复迁移'
          git rev-parse HEAD | tee "$EVIDENCE/commit.txt"
          git diff --stat 33c21e098ef3188cbab5a09f3e0a01fadb787715 HEAD | tee "$EVIDENCE/diff-stat.txt"
          sha256sum main.js styles.css | tee "$EVIDENCE/build-SHA256SUMS"
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archives-delivery-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archives-evidence/
          retention-days: 14
          if-no-files-found: warn
