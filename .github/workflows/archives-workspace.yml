name: Archives transfer verification
on:
  push:
    branches: [feat/archives-definition-domain-3]
    paths: [.github/workflows/archives-workspace.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');
            const dir = path.join(process.env.RUNNER_TEMP, 'archives-transfer');
            fs.mkdirSync(dir, {recursive: true});
            const shas = ['78d8093af9ec569eed78727dac3b1926840f2652', '37b7f31666e74e9bc24037524f65c8ae9e86c4e6', 'c09c8beecee9a8f84b3c02e60ba85ffa66d9c937'];
            const stats = [];
            for (let i = 0; i < shas.length; i++) {
              const {data} = await github.rest.git.getBlob({...context.repo, file_sha: shas[i]});
              const bytes = Buffer.from(data.content, data.encoding);
              fs.writeFileSync(path.join(dir, `part-${i}.bin`), bytes);
              stats.push({sha: shas[i], size: bytes.length, prefix: bytes.subarray(0,32).toString('hex'), digest: crypto.createHash('sha256').update(bytes).digest('hex')});
            }
            fs.writeFileSync(path.join(dir, 'manifest.json'), JSON.stringify(stats, null, 2));
            console.log(JSON.stringify(stats, null, 2));
      - uses: actions/upload-artifact@v4
        with:
          name: archives-transfer-verification
          path: ${{ runner.temp }}/archives-transfer/
          retention-days: 1
          if-no-files-found: error
