name: Apply reviewed browser phase 2 source
on:
  push:
    branches: ['feat/browser-phase2-issue-1']
    paths: ['.github/workflows/browser-phase2-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'NAMEWTA/obsidian-huhu' && github.ref == 'refs/heads/feat/browser-phase2-issue-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Decode the reviewed patch and verify its exact digest
        shell: bash
        run: |
          set -euo pipefail
          cat .github/browser-phase2-transfer/final-{01,02,03,04,05} | base64 --decode | gzip --decompress > "$RUNNER_TEMP/browser-phase2.patch"
          echo "c5b1108da655f0d12662a53d1ded8b0c37d18ccdfc26d7849ed4253b8d7c748e  $RUNNER_TEMP/browser-phase2.patch" | sha256sum --check
          git apply --check --whitespace=error-all "$RUNNER_TEMP/browser-phase2.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/browser-phase2.patch"
          while IFS= read -r path; do
            case "$path" in
              src/modules/browser/*|docs/browser*.md|scripts/bundle-budget.json|scripts/verify-browser-runtime-native.mjs) ;;
              *) echo "Unexpected source path: $path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --check
          git diff --cached --stat
          git rm .github/browser-phase2-transfer/final-{01,02,03,04,05}
      - name: Commit source without running repository code or rewriting history
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin feat/browser-phase2-issue-1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'feat(browser): 核验输入与 iframe 焦点并补齐二阶段验收追踪'
          git push origin HEAD:refs/heads/feat/browser-phase2-issue-1
