name: Highlights implementation workspace

on:
  push:
    branches: ["NAMEWTA/6"]
    paths: [".github/workflows/highlights-workspace.yml"]

permissions:
  contents: write

concurrency:
  group: highlights-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.repository == 'NAMEWTA/obsidian-huhu' && github.ref == 'refs/heads/NAMEWTA/6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
      - name: Apply the reviewed implementation with an exact createAnchor match
        shell: python
        run: |
          import subprocess
          import textwrap
          baseline = '1ba3aff5b469f192baa0c874d7bf141a10d8a12d'
          workflow = subprocess.check_output(['git', 'show', baseline + ':.github/workflows/highlights-workspace.yml'], text=True)
          marker = '      - name: Apply reviewed anchor safety changes to the exact source baseline\n'
          body = workflow.split(marker, 1)[1].split('        run: |\n', 1)[1].split('      - run: pnpm install --frozen-lockfile\n', 1)[0]
          script = textwrap.dedent(body)
          # The hash assignment also appears in Unicode normalization. Only the
          # createAnchor assignment is immediately followed by the kind field.
          needle = r'\t\ttextHash: hashString(text),'
          if script.count(needle) != 2:
              raise RuntimeError('Reviewed patch structure changed')
          script = script.replace(needle, needle + r'\n\t\tkind,')
          exec(compile(script, '<reviewed-highlight-anchor-patch>', 'exec'))
      - run: pnpm install --frozen-lockfile
      - name: Run all comments and highlight regressions
        run: pnpm exec vitest run src/modules/comments
      - name: Lint changed TypeScript
        run: pnpm exec eslint src/modules/comments/core/anchor.ts src/modules/comments/core/model.ts src/modules/comments/core/store.ts src/modules/comments/core/anchor-safety.test.ts --max-warnings 0
      - run: pnpm run build:css
      - run: pnpm run build
      - run: pnpm run check:bundle
      - name: Commit verified source and regenerated assets without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/NAMEWTA/6 | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'Branch advanced; refusing to push'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/comments/core/anchor.ts src/modules/comments/core/model.ts src/modules/comments/core/store.ts src/modules/comments/core/anchor-safety.test.ts docs/highlights-implementation.md .github/workflows/highlights-workspace.yml main.js styles.css
          git diff --cached --check
          git commit -m "fix(highlights): reject ambiguous anchors and verify cached document positions"
          git push origin HEAD:refs/heads/NAMEWTA/6
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highlights-anchor-safety-review
          path: |
            src/modules/comments/core/anchor.ts
            src/modules/comments/core/model.ts
            src/modules/comments/core/store.ts
            src/modules/comments/core/anchor-safety.test.ts
            docs/highlights-implementation.md
          retention-days: 7
