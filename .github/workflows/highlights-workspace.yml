name: Highlights implementation workspace

on:
  push:
    branches: ["NAMEWTA/6"]
    paths: [".github/workflows/highlights-workspace.yml"]

permissions:
  contents: write

concurrency:
  group: highlights-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.repository == 'NAMEWTA/obsidian-huhu' && github.ref == 'refs/heads/NAMEWTA/6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
      - name: Apply reviewed anchor safety changes to the exact source baseline
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import textwrap

          root = Path('src/modules/comments/core')
          expected = {
              'anchor.ts': '4123b83da87363dc4988d40a9c50f3f396fb8011',
              'model.ts': '7d54d9d9e2125480ac94cad0c9002f16a56b4240',
              'store.ts': '46ff4e15baf5b2b946fb781925d585285b7f8e61',
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', str(root / name)], text=True).strip()
              if actual != sha:
                  raise RuntimeError(f'{name} changed since review; refusing to overwrite it')

          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one source match: {old[:100]!r}')
              return text.replace(old, new, 1)

          def replace_section(text, start, end, new):
              first = text.index(start)
              last = text.index(end, first)
              return text[:first] + textwrap.dedent(new).lstrip('\n') + '\n\n' + text[last:]

          model = (root / 'model.ts').read_text()
          model = replace_once(model, '\ttextHash: string;\n', '\ttextHash: string;\n\t/** Document fingerprint validating cached UTF-16 offsets; absent on legacy anchors. */\n\tdocumentHash?: string;\n')
          (root / 'model.ts').write_text(model)

          store = (root / 'store.ts').read_text()
          store = replace_once(store,
              "\tfor (const key of ['text', 'textHash', 'before', 'after']) if (typeof anchor[key] !== 'string') return null;",
              "\tfor (const key of ['text', 'textHash', 'before', 'after']) if (typeof anchor[key] !== 'string') return null;\n\tif (anchor['documentHash'] !== undefined && (typeof anchor['documentHash'] !== 'string' || !/^[a-f0-9]{16}$/.test(anchor['documentHash']))) return null;")
          (root / 'store.ts').write_text(store)

          source = (root / 'anchor.ts').read_text()
          source = replace_once(source, 'export const CONTEXT_LENGTH = 50;', textwrap.dedent('''\
          export const CONTEXT_LENGTH = 50;

          // One-document cache avoids hashing the same note once per annotation.
          // This is only a lookup optimization, never a second persistence store.
          let fingerprintSource: string | undefined;
          let fingerprintValue = '';
          function documentFingerprint(doc: string): string {
          \tif (doc !== fingerprintSource) {
          \t\tfingerprintSource = doc;
          \t\tfingerprintValue = hashString(doc);
          \t}
          \treturn fingerprintValue;
          }

          const AMBIGUOUS = 'ambiguous' as const;
          type AnchorResolution = AnchorMatch | typeof AMBIGUOUS | null;
          '''))
          source = replace_once(source, '\t\ttextHash: hashString(text),', '\t\ttextHash: hashString(text),\n\t\tdocumentHash: documentFingerprint(doc),')
          source = source.replace('/** The text occurs more than once; the caller may want to warn. */', '/** Matching stage used to establish the position. */')
          source = source.replace('The line hint only breaks ties between repeated occurrences.', 'A line hint is advisory, not proof of identity.')
          source = replace_section(source,
              '/**\n * Stage 1: locate the anchor by exact content.\n *\n * Content rather than position is what makes a comment survive the note being\n * reorganised.\n',
              '/**\n * How much of `context`\'s tail',
              '''
          /** Exact content plus a unique best context; line proximity cannot resolve a tie. */
          function resolveByHash(doc: string, anchor: TextAnchorV2): AnchorResolution {
          \tconst { text } = anchor;
          \tif (text === '' || hashString(text) !== anchor.textHash) return null;
          \tconst found = occurrences(doc, text).filter(at => anchor.kind !== 'line' || (lineRangeAt(doc, at).from === at && lineRangeAt(doc, at).to === at + text.length));
          \tlet best: number | null = null;
          \tlet bestScore = -1;
          \tlet tied = false;
          \tfor (const offset of found) {
          \t\tconst score = contextScore(doc, offset, offset + text.length, anchor);
          \t\tif (score > bestScore) {
          \t\t\tbest = offset;
          \t\t\tbestScore = score;
          \t\t\ttied = false;
          \t\t} else if (score === bestScore) tied = true;
          \t}
          \tif (tied) return AMBIGUOUS;
          \treturn best === null ? null : { from: best, to: best + text.length, method: 'hash' };
          }

          export function matchByHash(doc: string, anchor: TextAnchorV2): AnchorMatch | null {
          \tconst result = resolveByHash(doc, anchor);
          \treturn result === AMBIGUOUS ? null : result;
          }
          ''')
          source = replace_once(source,
              'export function matchByContext(doc: string, anchor: TextAnchorV2): AnchorMatch | null {',
              'function resolveByContext(doc: string, anchor: TextAnchorV2): AnchorResolution {')
          source = replace_once(source,
              '\tlet best: { from: number; to: number; score: number } | null = null;',
              '\tlet best: { from: number; to: number; score: number } | null = null;\n\tlet tied = false;')
          source = replace_once(source,
              '\t\tif (!best || score > best.score) best = { from: start, to: end, score };',
              '\t\tif (!best || score > best.score) { best = { from: start, to: end, score }; tied = false; }\n\t\telse if (score === best.score) tied = true;')
          source = replace_once(source,
              '\treturn best ? { from: best.from, to: best.to, method: "context" } : null;\n}',
              '\tif (tied) return AMBIGUOUS;\n\treturn best ? { from: best.from, to: best.to, method: "context" } : null;\n}\n\nexport function matchByContext(doc: string, anchor: TextAnchorV2): AnchorMatch | null {\n\tconst result = resolveByContext(doc, anchor);\n\treturn result === AMBIGUOUS ? null : result;\n}')
          source = replace_section(source, 'function matchEmptyLine(', '/** Lines either side of the last known position', '''
          function matchEmptyLine(doc: string, anchor: TextAnchorV2): AnchorMatch | null {
          \tconst { before, after } = anchor;
          \tif (doc === '' && before === '' && after === '' && anchor.kind === 'line') return { from: 0, to: 0, method: 'context' };
          \tlet best: { at: number; score: number } | null = null;
          \tlet tied = false;
          \tfor (const at of emptyLineStarts(doc)) {
          \t\tconst beforeScore = before === '' ? 1 : suffixMatchAt(doc, at, before) / before.length;
          \t\tconst afterScore = after === '' ? 1 : prefixMatchAt(doc, at, after) / after.length;
          \t\tif (!vouchesFor(before, beforeScore) && !vouchesFor(after, afterScore)) continue;
          \t\tconst score = beforeScore + afterScore;
          \t\tif (!best || score > best.score) { best = { at, score }; tied = false; }
          \t\telse if (score === best.score) tied = true;
          \t}
          \treturn best && !tied ? { from: best.at, to: best.at, method: 'context' } : null;
          }
          ''')
          source = replace_once(source,
              '\treturn best ? { from: best.from, to: best.to, method: "fuzzy" } : null;',
              '''\tif (!best) return null;
          \t// Different endpoints of one overlapping fuzzy hit are not different passages.
          \t// Equally good disjoint passages are ambiguous, irrespective of the line hint.
          \tconst winner = best;
          \tif (matches.some(candidate => candidate.distance === winner.distance &&
          \t\t(candidate.to <= winner.from || candidate.from >= winner.to) &&
          \t\tcontextScore(doc, candidate.from, candidate.to, anchor) === winner.score)) return null;
          \treturn { from: winner.from, to: winner.to, method: 'fuzzy' };''')
          source = replace_section(source, 'export function matchAnchor(', '/** The two forms a note\'s text realistically arrives in. */', '''
          export function matchAnchor(doc: string, anchor: TextAnchorV2, options: MatchOptions = {}): AnchorMatch | null {
          \t// Cached offsets are authoritative only for the document that produced them.
          \t// An identical quote at a stale offset may belong to a different paragraph.
          \tif (anchor.documentHash === documentFingerprint(doc) && hashString(anchor.text) === anchor.textHash &&
          \t\tNumber.isInteger(anchor.start) && Number.isInteger(anchor.end) && anchor.start >= 0 && anchor.end >= anchor.start && anchor.end <= doc.length &&
          \t\tdoc.slice(anchor.start, anchor.end) === anchor.text &&
          \t\t(anchor.kind !== 'line' || (lineRangeAt(doc, anchor.start).from === anchor.start && lineRangeAt(doc, anchor.start).to === anchor.end))) {
          \t\treturn { from: anchor.start, to: anchor.end, method: 'hash' };
          \t}
          \tif (anchor.text === '') {
          \t\tconst context = resolveByContext(doc, anchor);
          \t\treturn context === AMBIGUOUS ? null : context ?? matchEmptyLine(doc, anchor);
          \t}
          \tconst forms = [anchor, ...renormalisations(anchor)];
          \t// An ambiguous exact match must not turn into a guessed context/fuzzy hit.
          \tfor (const form of forms) {
          \t\tconst exact = resolveByHash(doc, form);
          \t\tif (exact === AMBIGUOUS) return null;
          \t\tif (exact) return exact;
          \t}
          \tfor (const form of forms) {
          \t\tconst context = resolveByContext(doc, form);
          \t\tif (context === AMBIGUOUS) return null;
          \t\tif (context) return context;
          \t}
          \treturn options.fuzzy ? matchByFuzzy(doc, anchor, options.threshold ?? 0.3) : null;
          }
          ''')
          source = source.replace('/** HUHU v2 cached offsets followed by the upstream content/context/fuzzy stages. */', '/** Verified cached offsets, then unambiguous content/context/fuzzy recovery. */')
          source = replace_section(source, 'export function locateAnchor(', '/** Refuse frontmatter and any intersected fenced code', '''
          export function locateAnchor(doc: string, anchor: TextAnchorV2, threshold = 0.3): { start: number; end: number } | null {
          \tconst hit = matchAnchor(doc, anchor, { fuzzy: true, threshold });
          \treturn hit ? { start: hit.from, end: hit.to } : null;
          }
          ''')
          (root / 'anchor.ts').write_text(source)

          tests = root / 'anchor-safety.test.ts'
          if tests.exists():
              raise RuntimeError('Regression file already exists; refusing to replace it')
          tests.write_text(textwrap.dedent('''\
          import { describe, expect, test } from 'vitest';
          import { createAnchor, locateAnchor, matchAnchor, matchByContext, matchByFuzzy, matchByHash } from './anchor';

          const quote = 'abcdefghij';
          const block = 'L'.repeat(50) + quote + 'R'.repeat(50);

          describe('document identity and ambiguous highlight anchors', () => {
          \ttest('records a serializable document fingerprint without modifying Markdown', () => {
          \t\tconst anchor = createAnchor(block, 50, 60);
          \t\texpect(anchor.documentHash).toMatch(/^[a-f0-9]{16}$/);
          \t\texpect(locateAnchor(block, JSON.parse(JSON.stringify(anchor)) as typeof anchor)).toEqual({ start: 50, end: 60 });
          \t\texpect(block).toBe('L'.repeat(50) + quote + 'R'.repeat(50));
          \t});
          \ttest('preserves an explicit selection among identical passages in the same document', () => {
          \t\tconst doc = block + '\\n' + block;
          \t\tconst start = doc.lastIndexOf(quote);
          \t\tconst anchor = createAnchor(doc, start, start + quote.length);
          \t\texpect(locateAnchor(doc, anchor)).toEqual({ start, end: start + quote.length });
          \t\texpect(matchAnchor(doc, anchor)?.from).toBe(start);
          \t});
          \ttest('does not trust a stale offset now occupied by a different paragraph', () => {
          \t\tconst anchor = createAnchor(block, 50, 60);
          \t\tconst changed = 'X'.repeat(50) + quote + 'Y'.repeat(50) + '\\n' + block;
          \t\texpect(locateAnchor(changed, anchor)?.start).toBe(changed.lastIndexOf(quote));
          \t});
          \ttest('old anchors use contextual recovery, not a position-only shortcut', () => {
          \t\tconst anchor = createAnchor(block, 50, 60);
          \t\tdelete anchor.documentHash;
          \t\tconst changed = 'X'.repeat(50) + quote + 'Y'.repeat(50) + '\\n' + block;
          \t\texpect(locateAnchor(changed, anchor)?.start).toBe(changed.lastIndexOf(quote));
          \t});
          \ttest('equal exact evidence cannot be rescued by the stale line hint or fuzzy fallback', () => {
          \t\tconst anchor = createAnchor(block, 50, 60);
          \t\tconst changed = block + '\\n' + block;
          \t\texpect(matchByHash(changed, anchor)).toBeNull();
          \t\texpect(matchAnchor(changed, anchor)).toBeNull();
          \t\texpect(matchAnchor(changed, anchor, { fuzzy: true })).toBeNull();
          \t\texpect(locateAnchor(changed, anchor)).toBeNull();
          \t});
          \ttest('legacy identical passages without a document fingerprint remain detached', () => {
          \t\tconst doc = block + '\\n' + block;
          \t\tconst anchor = createAnchor(doc, 50, 60);
          \t\tdelete anchor.documentHash;
          \t\texpect(locateAnchor(doc, anchor)).toBeNull();
          \t});
          \ttest('a uniquely better context still wins after hundreds of inserted lines', () => {
          \t\tconst anchor = createAnchor(block, 50, 60);
          \t\tconst changed = quote + '\\n'.repeat(250) + block;
          \t\texpect(locateAnchor(changed, anchor)?.start).toBe(changed.lastIndexOf(quote));
          \t});
          \ttest('equal context-only matches cannot fall through to fuzzy guessing', () => {
          \t\tconst anchor = createAnchor(block, 50, 60);
          \t\tconst edited = block.replace(quote, 'abXYefghij');
          \t\tconst changed = edited + '\\n' + edited;
          \t\texpect(matchByContext(changed, anchor)).toBeNull();
          \t\texpect(locateAnchor(changed, anchor)).toBeNull();
          \t});
          \ttest('equally good disjoint fuzzy passages are not selected by proximity', () => {
          \t\tconst anchor = createAnchor(quote, 0, quote.length);
          \t\tconst changed = 'abXYefghij\\nabXYefghij';
          \t\texpect(matchByFuzzy(changed, anchor, 0.3)).toBeNull();
          \t\texpect(locateAnchor(changed, anchor)).toBeNull();
          \t});
          \ttest('a unique fuzzy passage is still recoverable', () => {
          \t\texpect(locateAnchor('abXYefghij', createAnchor(quote, 0, quote.length))).toEqual({ start: 0, end: 10 });
          \t});
          \ttest('normalization recovery keeps UTF-16 positions in the stored document', () => {
          \t\tconst text = 'Café😀';
          \t\tconst doc = '前\\n' + text.normalize('NFD') + '\\n后';
          \t\texpect(locateAnchor(doc, createAnchor(text, 0, text.length))).toEqual({ start: 2, end: 2 + text.normalize('NFD').length });
          \t});
          \ttest('normalization cannot conceal equally strong duplicate passages', () => {
          \t\tconst original = 'L'.repeat(50) + 'Café' + 'R'.repeat(50);
          \t\tconst edited = original.normalize('NFD');
          \t\texpect(locateAnchor(edited + '\\n' + edited, createAnchor(original, 50, 54))).toBeNull();
          \t});
          \ttest('new and legacy anchors on an empty document remain usable', () => {
          \t\tconst anchor = createAnchor('', 0, 0);
          \t\texpect(locateAnchor('', anchor)).toEqual({ start: 0, end: 0 });
          \t\tdelete anchor.documentHash;
          \t\texpect(locateAnchor('', anchor)).toEqual({ start: 0, end: 0 });
          \t});
          \ttest('duplicated blank-line context remains ambiguous after external changes', () => {
          \t\tconst doc = 'L'.repeat(50) + '\\n\\n' + 'R'.repeat(50);
          \t\texpect(locateAnchor(doc + '\\n' + doc, createAnchor(doc, 51, 51))).toBeNull();
          \t});
          });
          '''))

          doc = Path('docs/highlights-implementation.md')
          doc.write_text(doc.read_text() + textwrap.dedent('''

          ## 6. 锚点安全补强：实现与验证范围

          ### 复核结论

          HiLighter 的 `src/locate.ts` 通过正文 `<mark data-id>` 查找高亮，找不到时退回行号；HUHU 不往 Markdown 写入标记，因此不能照搬该定位策略。参考其滚动而不移动光标的交互，但定位证据仍必须来自 HUHU 的 sidecar 锚点。原始参考：[HiLighter 定位源码](https://github.com/PandoraReads/HiLighter/blob/main/src/locate.ts)。

          对当前实现的复核发现：只验证旧 offset 处的文本相同，不能排除该位置已被另一个重复段落占据；精确/上下文匹配得分相同后按旧行号或枚举顺序选择，也会把卡片挂到错误原文。返回 null 后继续模糊搜索会再次引入同一歧义。

          ### 实施顺序与决策

          1. 在 `TextAnchorV2` 增加可选 `documentHash`，创建锚点时记录文档指纹，sidecar 校验其格式。旧数据仍走内容恢复，不因缺少该字段被拒绝；不改写原文、不新增数据真源。
          2. 只有指纹、文本、合法 UTF-16 边界及行边界均通过验证时才信任缓存位置。同一文档中明确选择的重复段落仍可保持其位置。使用现有非密码学哈希，仅用于版本判别优化，不把它当成安全认证；按最后一个文档缓存指纹，避免每个锚点重复哈希整篇笔记。
          3. 精确匹配与上下文匹配内部保留“没有命中”和“有多个等强命中”的区别。歧义终止恢复，不能降级到模糊猜测；模糊恢复中的等强、互不重叠候选同样返回未定位。旧行号只限制模糊搜索窗口，不作为跨段落身份依据。
          4. 不改变现有 UI 的 orphaned 提示和显式重挂流程；继续保留 Unicode NFC/NFD、UTF-16 偏移、行级批注与空行行为。
          5. 增加 `core/anchor-safety.test.ts`，覆盖指纹往返、同文档重复选区、旧 offset 被占用、旧数据、重复上下文、模糊歧义、Unicode 与空行；同时运行整个 comments 模块原有测试，检查回归与已有性能预算。
          6. 通过定向测试、受影响文件 lint 和生产构建后再提交源代码及 `main.js/styles.css`；工作区执行任务结束时恢复只读验证工作流。完整仓库 CI 与真实 Obsidian 手工验收分别记录，不能以专项结果替代。

          ### 必须保留的验收边界

          旧锚点缺少文档指纹且出现完全重复上下文时，宁可要求显式重挂，也不以旧行号猜测。非密码学指纹存在理论碰撞概率，不承诺对抗恶意构造。宿主多窗口、移动端、IME、主题和跨设备同时写入仍需真实 Obsidian 验收；本节是实现与测试设计，不是这些人工验收已通过的声明。
          '''))

          # The integration job is temporary. The committed final workflow is read-only.
          Path('.github/workflows/highlights-workspace.yml').write_text(textwrap.dedent('''\
          name: Highlights validation

          on:
            push:
              branches: ["NAMEWTA/6"]
            pull_request:
              paths:
                - "src/modules/comments/**"
                - "docs/highlights-implementation.md"
                - ".github/workflows/highlights-workspace.yml"
                - "package.json"
                - "pnpm-lock.yaml"

          permissions:
            contents: read

          concurrency:
            group: highlights-validation-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            highlights:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v5
                  with:
                    persist-credentials: false
                - uses: pnpm/action-setup@v4
                - uses: actions/setup-node@v5
                  with:
                    node-version: 22.x
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - run: pnpm exec vitest run src/modules/comments
                - run: pnpm exec eslint src/modules/comments --max-warnings 0
                - run: pnpm run build:css
                - run: pnpm run build
                - run: pnpm run check:bundle
                - uses: actions/upload-artifact@v4
                  with:
                    name: highlights-built-assets-${{ github.sha }}
                    path: |
                      main.js
                      styles.css
                      manifest.json
                      docs/highlights-implementation.md
                    retention-days: 7
          '''))
      - run: pnpm install --frozen-lockfile
      - name: Run all comments and highlight regressions
        run: pnpm exec vitest run src/modules/comments
      - name: Lint changed TypeScript
        run: pnpm exec eslint src/modules/comments/core/anchor.ts src/modules/comments/core/model.ts src/modules/comments/core/store.ts src/modules/comments/core/anchor-safety.test.ts --max-warnings 0
      - run: pnpm run build:css
      - run: pnpm run build
      - run: pnpm run check:bundle
      - name: Commit verified source and regenerated assets without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/NAMEWTA/6 | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'Branch advanced; refusing to push'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/comments/core/anchor.ts src/modules/comments/core/model.ts src/modules/comments/core/store.ts src/modules/comments/core/anchor-safety.test.ts docs/highlights-implementation.md .github/workflows/highlights-workspace.yml main.js styles.css
          git diff --cached --check
          git commit -m "fix(highlights): reject ambiguous anchors and verify cached document positions"
          git push origin HEAD:refs/heads/NAMEWTA/6
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highlights-anchor-safety-review
          path: |
            src/modules/comments/core/anchor.ts
            src/modules/comments/core/model.ts
            src/modules/comments/core/store.ts
            src/modules/comments/core/anchor-safety.test.ts
            docs/highlights-implementation.md
          retention-days: 7
