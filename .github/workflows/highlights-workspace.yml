name: Highlights branch verification
on:
  push:
    branches: ["NAMEWTA/6"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-highlights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec vitest run src/modules/comments src/app/workbench/comments-leaf.dom.test.tsx
      - run: pnpm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: highlights-built-assets
          path: |
            main.js
            styles.css
          retention-days: 2
