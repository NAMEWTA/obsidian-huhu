name: Hook Windows measurement

on:
  push:
    branches:
      - codex/dev-overhaul-hook-validation
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Measured cold-process rounds (AC-311 target: at least 20)'
        type: number
        default: 20
        required: true

permissions:
  contents: read

jobs:
  hook-32x3:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HUHU_HOOK_ROUNDS: ${{ github.event_name == 'push' && 20 || inputs.rounds }}
      HUHU_HOOK_EXPECT_PLATFORM: win32
      HUHU_TEST_HOOK_EVIDENCE: temp/dev-overhaul/hook/windows-run
    steps:
      # Versions follow .github/workflows/lint.yml; pnpm follows package.json.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run exactly 32 scopes x 3 ordered events in independent rounds
        run: pnpm exec node scripts/fixtures/dev-overhaul-hook/run-measurement.mjs
      - name: Preserve every round including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/dev-overhaul/hook/windows-run/
          if-no-files-found: error
          retention-days: 14
