name: Node.js build

on:
    workflow_dispatch:
    workflow_call:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ${{ matrix.os }}
        env:
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: core.autocrlf
            GIT_CONFIG_VALUE_0: ${{ matrix.os == 'windows-latest' && 'true' || 'false' }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, node-version: 22.x }
                    - { os: ubuntu-latest, node-version: 24.x }
                    - { os: windows-latest, node-version: 24.x }

        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.sha }}
            - uses: pnpm/action-setup@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/setup-go@v6
              with:
                  go-version: '1.26.10'
                  cache-dependency-path: native/huhubot/go.sum
            - name: Download Go modules
              shell: bash
              working-directory: native/huhubot
              run: |
                  for i in 1 2 3 4 5; do
                    if go mod download; then
                      exit 0
                    fi
                    echo "go mod download failed (attempt $i)" >&2
                    sleep $((i * 2))
                  done
                  exit 1
            - name: Verify Linux Secret Service contract prerequisites
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  command -v dbus-daemon
                  python3 -c 'import sqlite3'
                  pnpm exec esbuild --version
            - run: pnpm run check:huhu-bot
              # TEMPORARY: dump the drain stage and goroutines when Core.Close times out.
              env:
                  HUHU_BOT_CLOSE_DIAG: ${{ runner.os == 'Windows' && '1' || '' }}
            - run: pnpm run build:huhu-bot
            - name: Exercise the native Bot Runner
              shell: bash
              run: |
                  if [ "$RUNNER_OS" = "Windows" ]; then
                    node scripts/verify-huhu-bot.mjs native/huhubot/dist/huhu-bot-win32-x64.exe
                  else
                    node scripts/verify-huhu-bot.mjs native/huhubot/dist/huhu-bot-linux-x64
                  fi
            - run: pnpm run build
            - run: pnpm run check:bundle
            - run: git diff --exit-code -- main.js styles.css browser-worker.cjs browser-worker.cjs.sha256 browser-cli.cjs browser-cli.cjs.sha256 src/modules/browser/platform/desktop/runtime/main-source.generated.json src/modules/browser/platform/desktop/runtime/worker-digest.generated.json
            - run: pnpm run lint
            - run: pnpm run lint:css
            - run: pnpm run check:native
            - run: pnpm run test:all
              env:
                  HUHU_TEST_PTY_BINARY: ${{ github.workspace }}/native/pty-server/target/debug/huhu-pty${{ runner.os == 'Windows' && '.exe' || '' }}
                  HUHU_TEST_CONTROL_BINARY: ${{ github.workspace }}/native/pty-server/target/debug/huhu${{ runner.os == 'Windows' && '.exe' || '' }}
            - run: pnpm run check:notices
