name: Node.js build

on:
    workflow_dispatch:
    workflow_call:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ${{ matrix.os }}
        env:
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: core.autocrlf
            GIT_CONFIG_VALUE_0: ${{ matrix.os == 'windows-latest' && 'true' || 'false' }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, node-version: 22.x }
                    - { os: ubuntu-latest, node-version: 24.x }
                    - { os: windows-latest, node-version: 24.x }

        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.sha }}
            - uses: pnpm/action-setup@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/setup-go@v6
              with:
                  go-version: '1.26.10'
                  cache-dependency-path: native/huhubot/go.sum
            - name: Verify Linux Secret Service contract prerequisites
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  command -v dbus-daemon
                  python3 -c 'import sqlite3'
                  pnpm exec esbuild --version
            - run: pnpm run check:huhu-bot
            - run: pnpm run build:huhu-bot
            - name: Exercise the native Bot Runner
              shell: bash
              run: |
                  if [ "$RUNNER_OS" = "Windows" ]; then
                    node scripts/verify-huhu-bot.mjs native/huhubot/dist/huhu-bot-win32-x64.exe
                  else
                    node scripts/verify-huhu-bot.mjs native/huhubot/dist/huhu-bot-linux-x64
                  fi
            - run: pnpm run build
            - run: pnpm run check:bundle
            - run: git diff --exit-code -- main.js styles.css
            - run: pnpm run lint
            - run: pnpm run lint:css
            - run: pnpm run test:all
            - run: pnpm run check:notices
            - run: pnpm run check:native
