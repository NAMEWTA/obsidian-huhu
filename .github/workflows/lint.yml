name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Package verification dependencies
        run: tar -czf /tmp/huhu-verification-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: huhu-verification-deps
          path: /tmp/huhu-verification-deps.tar.gz
          retention-days: 1
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: huhu-plugin-${{ github.sha }}
          path: |
            main.js
            styles.css
            manifest.json
          retention-days: 7
      - run: pnpm run check:bundle
      - run: pnpm run lint
      - run: pnpm run lint:css
      - run: pnpm run check:native
      - run: pnpm run test:all
        env:
          HUHU_TEST_PTY_BINARY: ${{ github.workspace }}/native/pty-server/target/debug/huhu-pty
          HUHU_TEST_CONTROL_BINARY: ${{ github.workspace }}/native/pty-server/target/debug/huhu
      - run: pnpm run check:notices
      - run: git diff --exit-code -- main.js styles.css
