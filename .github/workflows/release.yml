name: Release

on:
    workflow_dispatch:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    checks:
        uses: ./.github/workflows/lint.yml
    terminal:
        uses: ./.github/workflows/terminal-build.yml
    browser:
        uses: ./.github/workflows/browser-runtime-build.yml
    bot:
        uses: ./.github/workflows/huhu-bot.yml
    release:
        needs: [checks, terminal, browser, bot]
        if: ${{ needs.checks.result == 'success' && needs.terminal.result == 'success' && needs.browser.result == 'success' && needs.bot.result == 'success' }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.sha }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - name: Verify versions and changelog
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node scripts/verify-release-artifacts.mjs "$RELEASE_TAG"
            - run: pnpm run build
            - name: The tagged commit carries its own build
              run: git diff --exit-code -- main.js styles.css browser-worker.cjs browser-worker.cjs.sha256 browser-cli.cjs browser-cli.cjs.sha256 src/modules/browser/platform/desktop/runtime/main-source.generated.json src/modules/browser/platform/desktop/runtime/worker-digest.generated.json
            - run: pnpm run check:bundle

            - name: Package plugin files
              id: package
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  id=$(node -p "require('./manifest.json').id")
                  rm -rf dist release-assets
                  mkdir -p "dist/$id" release-assets
                  cp main.js manifest.json styles.css browser-worker.cjs browser-worker.cjs.sha256 browser-cli.cjs browser-cli.cjs.sha256 LICENSE NOTICE THIRD-PARTY-NOTICES.md "dist/$id/"
                  cp main.js manifest.json styles.css browser-worker.cjs browser-worker.cjs.sha256 browser-cli.cjs browser-cli.cjs.sha256 release-assets/
                  zip_name="${id}-${RELEASE_TAG}.zip"
                  (cd dist && zip -r "../release-assets/$zip_name" "$id")
                  echo "zip=release-assets/$zip_name" >> "$GITHUB_OUTPUT"
                  node scripts/verify-release-artifacts.mjs "$RELEASE_TAG" --plugin release-assets

            - name: Generate build provenance attestation
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      ${{ steps.package.outputs.zip }}
                      release-assets/main.js
                      release-assets/styles.css
                      release-assets/browser-worker.cjs
                      release-assets/browser-cli.cjs

            - uses: actions/download-artifact@v4
              with:
                  pattern: terminal-*
                  merge-multiple: true
                  path: terminal-artifacts

            - name: Verify all terminal assets and checksums
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node scripts/verify-release-artifacts.mjs "$RELEASE_TAG" terminal-artifacts

            - name: Exercise packaged Linux helper and control CLI
              run: |
                  chmod +x terminal-artifacts/huhu-pty-linux-x64 terminal-artifacts/huhu-linux-x64
                  node scripts/verify-pty-helper.mjs terminal-artifacts/huhu-pty-linux-x64 terminal-artifacts/huhu-linux-x64

            - uses: actions/download-artifact@v4
              with:
                  name: huhu-browser-runtime-linux-x64
                  path: browser-artifacts

            - name: Attest the sandbox-verified browser runtime
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: browser-artifacts/huhu-browser-runtime-linux-x64.tar.gz

            - uses: actions/download-artifact@v4
              with:
                  pattern: huhu-bot-*
                  merge-multiple: true
                  path: native/huhubot/dist

            - name: Verify every Bot target, checksum and compatibility manifest
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node scripts/verify-release-artifacts.mjs "$RELEASE_TAG" --bot native/huhubot/dist

            - name: Exercise packaged Linux Bot Runner
              run: |
                  chmod +x native/huhubot/dist/huhu-bot-linux-x64
                  node scripts/verify-huhu-bot.mjs native/huhubot/dist/huhu-bot-linux-x64

            - name: Checksums for every asset
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  cp terminal-artifacts/* release-assets/
                  cp browser-artifacts/huhu-browser-runtime-linux-x64.tar.gz release-assets/
                  cp native/huhubot/dist/* release-assets/
                  cp LICENSE NOTICE THIRD-PARTY-NOTICES.md release-assets/
                  node scripts/verify-release-artifacts.mjs "$RELEASE_TAG" --sums release-assets

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release-assets/*
                  generate_release_notes: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  make_latest: ${{ !contains(github.ref_name, '-') }}
