name: Safe notes workspace preparation
on:
  push:
    branches: [fix/safe-notes-polish-20261028]
    paths: [.github/workflows/safe-notes-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Package isolated working copy without credentials
        run: |
          git archive HEAD | gzip > /tmp/huhu-source.tar.gz
          tar -czf /tmp/huhu-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: safe-notes-workspace
          path: |
            /tmp/huhu-source.tar.gz
            /tmp/huhu-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
