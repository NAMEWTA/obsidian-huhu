name: Apply task domain implementation
on:
  push:
    branches: [refactor/task-domain-7]
    paths: [.github/workflows/task-domain-apply.yml]
permissions:
  contents: write
jobs:
  implement:
    if: github.ref == 'refs/heads/refactor/task-domain-7'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified implementation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          const hash = b => createHash('sha256').update(b).digest('hex');
          const encoded = Array.from({ length: 8 }, (_, i) => fs.readFileSync(`.task-transfer/part-${String(i).padStart(2, '0')}.b64`, 'utf8')).join('');
          const compressed = Buffer.from(encoded, 'base64');
          if (hash(compressed) !== 'fd3134d391e159ca838ccb66a9e029da0ef8bdfa0a094fd6e2e4f5fb2db72612') throw new Error('Payload checksum mismatch');
          const changes = JSON.parse(brotliDecompressSync(compressed).toString('utf8'));
          if (!Array.isArray(changes) || changes.length !== 113) throw new Error('Unexpected manifest');
          const prepared = [];
          for (const c of changes) {
            if (typeof c.p !== 'string' || c.p.includes('..') || path.isAbsolute(c.p) || !/^(src\/|scripts\/|test\/|docs\/|README(?:\.ZH)?\.md$|package\.json$)/.test(c.p)) throw new Error(`Unsafe path: ${c.p}`);
            const exists = fs.existsSync(c.p);
            if (exists && !fs.lstatSync(c.p).isFile()) throw new Error(`Not a regular file: ${c.p}`);
            const old = exists ? fs.readFileSync(c.p) : Buffer.alloc(0);
            if (c.old === null ? exists : !exists || hash(old) !== c.old) throw new Error(`Baseline mismatch: ${c.p}`);
            if (c.new === null) { prepared.push([c.p, null]); continue; }
            const lines = old.toString('utf8').match(/[^\n]*\n|[^\n]+$/g) ?? [];
            let previous = lines.length;
            for (const [start, end, insertion] of [...c.ops].reverse()) {
              if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end < start || end > previous || typeof insertion !== 'string') throw new Error(`Invalid edit: ${c.p}`);
              lines.splice(start, end - start, insertion);
              previous = start;
            }
            const next = Buffer.from(lines.join(''), 'utf8');
            if (hash(next) !== c.new) throw new Error(`Result checksum mismatch: ${c.p}`);
            prepared.push([c.p, next]);
          }
          for (const [name, next] of prepared) {
            if (next === null) fs.unlinkSync(name);
            else { fs.mkdirSync(path.dirname(name), { recursive: true }); fs.writeFileSync(name, next); }
          }
          fs.rmSync('.task-transfer', { recursive: true, force: true });
          fs.rmSync('.github/workflows/task-domain-apply.yml', { force: true });
          console.log(`Applied ${prepared.length} checksum-verified source changes; transport files removed.`);
          NODE
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install unchanged locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check production and test sources
        run: |
          pnpm exec tsc --noEmit --skipLibCheck
          pnpm exec tsc --skipLibCheck -p tsconfig.test.json
      - name: Domain, integration and architecture checks
        run: |
          pnpm test:task --maxWorkers=2
          pnpm test:architecture
          pnpm test:i18n
          pnpm test:ui-styles
          pnpm test:ui-adapters
          pnpm test:ui-runtime
          pnpm test:promise-callbacks
      - name: Lint
        run: pnpm lint
      - name: Rebuild checked-in release assets
        run: |
          node scripts/build-tailwind.mjs
          node scripts/build-styles.mjs --write
          node esbuild.config.mjs production
          pnpm test:build-text
          pnpm check:bundle
          git diff --check
      - name: Commit only to the task implementation branch
        env:
          TARGET_BRANCH: refactor/task-domain-7
        run: |
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(task)!: extract independent task domain with public API and AI tools'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
