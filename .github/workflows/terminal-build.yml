name: Build terminal helper

on:
  workflow_call:
  workflow_dispatch:
  # Push to dev has no path filter. This pull request changes more than 3000 files,
  # and GitHub only matches a path filter against the first 3000, so the filtered
  # pull_request event never starts. A dev push still has to build every target.
  push:
    branches: [dev]
  pull_request:
    paths: ['native/pty-server/**', 'scripts/verify-pty-helper.mjs', 'scripts/verify-release-artifacts.mjs', 'src/shared/native/control-schema.json', '.github/workflows/terminal-build.yml']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-x64, ext: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64, ext: '' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: darwin-x64, ext: '' }
          - { os: macos-15, target: aarch64-apple-darwin, asset: darwin-arm64, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: win32-x64, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test and build
        shell: bash
        run: |
          cargo test --locked --manifest-path native/pty-server/Cargo.toml --target '${{ matrix.target }}'
          cargo build --locked --release --manifest-path native/pty-server/Cargo.toml --target '${{ matrix.target }}'
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Exercise the helper over stdio and the control CLI (protocol pairing, schema/help, stdin, exit codes)
        run: node scripts/verify-pty-helper.mjs native/pty-server/target/${{ matrix.target }}/release/huhu-pty${{ matrix.ext }} native/pty-server/target/${{ matrix.target }}/release/huhu${{ matrix.ext }}
      - name: Package binaries, checksums and CLI compatibility record
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, subprocess
          release = pathlib.Path('native/pty-server/target/${{ matrix.target }}/release')
          output = pathlib.Path('terminal-artifacts')
          output.mkdir()
          def publish(source_name, name):
              target = output / name
              shutil.copy2(release / source_name, target)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              (output / (name + '.sha256')).write_text(digest + '  ' + name + '\n')
              return target, digest
          publish('huhu-pty${{ matrix.ext }}', 'huhu-pty-${{ matrix.asset }}${{ matrix.ext }}')
          cli, digest = publish('huhu${{ matrix.ext }}', 'huhu-${{ matrix.asset }}${{ matrix.ext }}')
          # The record is read from the binary that was just built, so a release can never claim a protocol it does not speak.
          version = json.loads(subprocess.run([str(cli), '--json', 'version'], check=True, capture_output=True, text=True).stdout)
          record = {'schema': 1, 'asset': cli.name, 'cliProtocol': version['protocolVersion'], 'helperProtocol': version['data']['helperProtocol'], 'sha256': digest}
          (output / (cli.name + '.compat.json')).write_text(json.dumps(record, sort_keys=True) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.asset }}
          path: terminal-artifacts/*
