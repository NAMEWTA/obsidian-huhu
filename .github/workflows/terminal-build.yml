name: Build terminal helper

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['native/pty-server/**', 'scripts/verify-pty-helper.mjs', '.github/workflows/terminal-build.yml']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-x64, ext: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64, ext: '' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: darwin-x64, ext: '' }
          - { os: macos-15, target: aarch64-apple-darwin, asset: darwin-arm64, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: win32-x64, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test and build
        shell: bash
        run: |
          cargo test --locked --manifest-path native/pty-server/Cargo.toml --target '${{ matrix.target }}'
          cargo build --locked --release --manifest-path native/pty-server/Cargo.toml --target '${{ matrix.target }}'
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Exercise the helper over stdio (sessions, flow control, exit on stdin close)
        run: node scripts/verify-pty-helper.mjs native/pty-server/target/${{ matrix.target }}/release/huhu-pty${{ matrix.ext }}
      - name: Package binary and checksum
        shell: python
        run: |
          import hashlib, pathlib, shutil
          name = 'huhu-pty-${{ matrix.asset }}${{ matrix.ext }}'
          source = pathlib.Path('native/pty-server/target/${{ matrix.target }}/release/huhu-pty${{ matrix.ext }}')
          output = pathlib.Path('terminal-artifacts')
          output.mkdir()
          target = output / name
          shutil.copy2(source, target)
          (output / (name + '.sha256')).write_text(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + name + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.asset }}
          path: terminal-artifacts/*
