<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img">
  <title>HUHU · 蜷躺举爪的虎虎</title>
  <desc>比例协调的全身橘色虎斑猫虎虎，侧身蜷躺、歪头开口笑；右白爪举起露出粉色心形肉垫，另一前爪搭在胸前，一只白后脚自然露出。白胸腹与右下方环抱的条纹长尾构成完整轮廓。原生可编辑矢量绘制。</desc>
