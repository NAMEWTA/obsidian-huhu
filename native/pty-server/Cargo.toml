[package]
name = "huhu-pty"
version = "0.0.1"
edition = "2021"
license-file = "../../LICENSE"
description = "Pseudo-terminal helper for the HUHU Obsidian plugin (stdio frame protocol)"
publish = false

[[bin]]
name = "huhu-pty"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
