<div class="huhu-ui">
  <button id="plain-button">Plain</button>
  <button id="ghost-button" class="inline-flex size-8 shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium whitespace-nowrap outline-none hover:bg-accent hover:text-accent-foreground dark:hover:bg-accent/50">G</button>
  <button id="outline-button" class="inline-flex h-9 items-center justify-center rounded-md border border-border bg-background px-4 py-2 text-sm font-medium shadow-xs hover:bg-accent hover:text-accent-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50">Outline</button>
  <input id="text-input" type="text" class="h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs outline-none md:text-sm dark:bg-input/30" placeholder="type">
  <div class="markdown-rendered"><button id="md-button">MD</button><input id="md-input" type="text"></div>
  <input id="native-checkbox" type="checkbox" class="huhu-native">
  <div id="outer-ui" class="huhu-ui"><div id="nested-ui" class="huhu-ui" style="background-color: var(--primary); color: var(--destructive)">nested</div></div>
  <button id="destructive-button" class="inline-flex h-9 items-center justify-center rounded-md px-4 py-2 text-sm font-medium bg-destructive text-destructive-foreground hover:bg-destructive/90 dark:bg-destructive/60 dark:text-white">Delete</button>
  <button id="destructive-solid" class="inline-flex h-9 items-center justify-center rounded-md px-4 py-2 text-sm font-medium bg-destructive text-destructive-foreground hover:bg-destructive/90">End</button>
  <span id="agent-question-sample" class="huhu-ui" style="background-color: var(--agent-question)">q</span>
  <span id="chart-sample-1" class="huhu-ui" style="background-color: var(--chart-1)">1</span>
  <span id="chart-sample-2" class="huhu-ui" style="background-color: var(--chart-2)">2</span>
  <span id="chart-sample-3" class="huhu-ui" style="background-color: var(--chart-3)">3</span>
  <span id="chart-sample-4" class="huhu-ui" style="background-color: var(--chart-4)">4</span>
  <span id="chart-sample-5" class="huhu-ui" style="background-color: var(--chart-5)">5</span>
</div>
<!-- A surface that mounts straight under <body> (no workbench around it). -->
<div id="standalone-ui" class="huhu-ui huhu-portal-root" style="display: block; background-color: var(--primary); color: var(--destructive)">standalone</div>
